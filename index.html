<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUP CROP</title>
    <style>
        /* 기본 리셋 및 스타일 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #E2F0D9; /* 이미지의 연두색 배경 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 1. 상단 헤더 영역 */
        header {
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 2px solid #166088;
            z-index: 10;
        }

        /* 좌측 햄버거 메뉴 아이콘 */
        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
        }
        .menu-icon div {
            width: 35px;
            height: 3px;
            background-color: #166088;
        }

        /* 상단 중앙 CUP CROP 로고/이미지 */
        .logo-box {
            background-color: #166088;
            color: white;
            padding: 8px 30px;
            font-weight: bold;
            font-size: 18px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            cursor: pointer;
        }
        .logo-box img {
            max-height: 30px; /* 이미지를 넣을 경우 사용 */
            display: none;
        }

        /* 우측 상단 메인 메뉴/로그인 버튼 */
        .nav-links {
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            background-color: #166088;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .nav-btn:hover {
            background-color: #104868;
        }

        /* 2. 메인 컨텐츠 영역 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding-left: 100px; /* 좌측 잡지 버튼 공간 확보 */
        }

        /* 좌측 잡지 버튼 (반원 곡선 형태) */
        .magazine-btn {
            position: absolute;
            left: -120px;
            top: 50%;
            transform: translateY(-50%);
            width: 250px;
            height: 500px;
            background-color: #166088;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 35px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s;
            z-index: 5;
        }
        .magazine-btn:hover {
            transform: translateY(-50%) scale(1.03);
        }

        /* 중앙 3개 원형 버튼 컨테이너 */
        .circle-container {
            display: flex;
            gap: 60px;
            margin-bottom: 60px;
        }

        .circle-btn {
            width: 180px;
            height: 180px;
            background-color: #166088;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle-btn:hover {
            transform: translateY(-5px);
            background-color: #104868;
        }

        /* 하단 AI 프롬프트 입력 바 */
        .ai-prompt-bar {
            width: 75%;
            max-width: 900px;
            height: 55px;
            background-color: #166088;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 5px 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .ai-prompt-bar input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 16px;
        }
        .ai-prompt-bar input::placeholder {
            color: #b0c4de;
        }

        .ai-prompt-bar button {
            background-color: #ffffff;
            color: #166088;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }

        /* 3. 팝업(모달) 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal-content h2 {
            margin-bottom: 15px;
            color: #166088;
        }

        .modal-content p {
            color: #555;
            margin-bottom: 20px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 -->
    <header>
        <div class="menu-icon">
            <div></div>
            <div></div>
            <div></div>
        </div>
        
        <!-- 회사 이름 / 로고 이미지 영역 -->
        <div class="logo-box">
            <!-- 이미지가 준비되시면 아래 img 태그 주석을 해제하고 src를 입력하세요 -->
            <!-- <img src="cupcrop-logo.png" alt="CUP CROP"> -->
            <span>CUP CROP</span>
        </div>

        <div class="nav-links">
            <button class="nav-btn" onclick="openModal('메뉴 1', '준비 중인 페이지입니다.')">메뉴1</button>
            <button class="nav-btn" onclick="openModal('메뉴 2', '준비 중인 페이지입니다.')">메뉴2</button>
            <button class="nav-btn" onclick="openModal('메뉴 3', '준비 중인 페이지입니다.')">메뉴3</button>
            <button class="nav-btn" onclick="openModal('로그인', '로그인 화면 팝업입니다.')">로그인</button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main>
        <!-- 좌측 잡지 이동 버튼 -->
        <div class="magazine-btn" onclick="openModal('잡지', '잡지 페이지로 이동합니다.')">
            잡지 &gt;
        </div>

        <!-- 가운데 3개 원형 버튼 -->
        <div class="circle-container">
            <button class="circle-btn" onclick="openModal('나무', '나무 관련 상세 페이지/팝업 내용입니다.')">나무</button>
            <button class="circle-btn" onclick="openModal('꽃', '꽃 관련 상세 페이지/팝업 내용입니다.')">꽃</button>
            <button class="circle-btn" onclick="openModal('식물', '식물 관련 상세 페이지/팝업 내용입니다.')">식물</button>
        </div>

        <!-- 하단 AI 프롬프트 입력창 -->
        <div class="ai-prompt-bar">
            <input type="text" id="promptInput" placeholder="AI 프롬프트를 입력하세요..." onkeypress="handleKeyPress(event)">
            <button onclick="submitPrompt()">전송</button>
        </div>
    </main>

    <!-- 공통 팝업(모달) 창 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle">팝업 제목</h2>
            <p id="modalBody">팝업 내용입니다.</p>
        </div>
    </div>

    <!-- JavaScript 동적 제어 -->
    <script>
        // 팝업 열기 함수
        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = text;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        // 팝업 닫기 함수
        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        // 바깥 클릭 시 팝업 닫기
        window.onclick = function(event) {
            const modal = document.getElementById('modalOverlay');
            if (event.target === modal) {
                closeModal();
            }
        };

        // AI 프롬프트 제출 처리
        function submitPrompt() {
            const input = document.getElementById('promptInput');
            if (input.value.trim() !== "") {
                openModal('AI 프롬프트 생성', `'${input.value}' 프롬프트를 생성 중입니다...`);
                input.value = '';
            } else {
                alert('프롬프트를 입력해주세요!');
            }
        }

        // 엔터키 입력 이벤트
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                submitPrompt();
            }
        }
    </script>
</body>
</html>
